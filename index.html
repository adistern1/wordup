<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordUp! 🚀</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { min-height:100%; background:linear-gradient(160deg,#120a2e 0%,#1e1050 45%,#0d1a3a 100%); }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#fff; min-height:100vh; background:transparent; }

.screen { display:none; }
.screen.on { display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:0 16px 32px; }

/* ══ HOME ══ */
#s-home { padding-top:32px; gap:0; }

.app-header { text-align:center; margin-bottom:24px; }
.title {
  font-size:48px; font-weight:900; letter-spacing:-2px;
  background:linear-gradient(135deg,#c084fc,#818cf8,#38bdf8);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.subtitle { font-size:14px; color:rgba(255,255,255,0.45); margin-top:2px; }

.sets-list { width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px; }

.set-card {
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:20px; padding:16px 16px 14px;
}
.set-card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.set-name { font-size:16px; font-weight:800; }
.set-del   { background:none; border:none; color:rgba(255,255,255,0.3); font-size:18px; cursor:pointer; padding:0 4px; }
.set-del:active { color:#ef4444; }
.set-share { background:none; border:none; color:rgba(255,255,255,0.3); font-size:18px; cursor:pointer; padding:0 4px; }
.set-share:active { color:#38bdf8; }

.set-bar-wrap { height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; margin-bottom:8px; }
.set-bar { height:100%; background:linear-gradient(90deg,#10b981,#c084fc); border-radius:3px; transition:width .6s ease; }

.set-stats { display:flex; align-items:center; justify-content:space-between; }
.set-nums { font-size:12px; color:rgba(255,255,255,0.5); }
.set-nums strong { color:#c084fc; font-size:14px; }
.btn-play-set {
  padding:8px 20px; border:none; border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#4338ca);
  color:#fff; font-size:14px; font-weight:700; cursor:pointer;
  box-shadow:0 4px 14px rgba(124,58,237,0.4);
}
.btn-play-set:active { transform:scale(0.96); }

.btn-add {
  width:100%; max-width:420px; margin-top:14px;
  padding:16px; border:2px dashed rgba(255,255,255,0.2);
  border-radius:20px; background:rgba(255,255,255,0.04);
  color:rgba(255,255,255,0.6); font-size:16px; font-weight:700;
  cursor:pointer; transition:all .2s;
}
.btn-add:active { background:rgba(255,255,255,0.1); }

/* ══ ADD SET SCREEN ══ */
#s-add { padding-top:20px; justify-content:flex-start; }

.add-topbar {
  display:flex; align-items:center; gap:12px;
  width:100%; max-width:420px; margin-bottom:16px;
}
.btn-back {
  background:none; border:none; color:rgba(255,255,255,0.6);
  font-size:15px; cursor:pointer; padding:6px 0;
}
.add-topbar h2 { font-size:20px; font-weight:800; }

/* tabs */
.add-tabs {
  display:flex; width:100%; max-width:420px;
  gap:8px; margin-bottom:20px;
}
.atab {
  flex:1; padding:10px 6px;
  border:1px solid rgba(255,255,255,0.15); border-radius:12px;
  background:rgba(255,255,255,0.05);
  color:rgba(255,255,255,0.5); font-size:14px; font-weight:700;
  cursor:pointer; transition:all .15s;
}
.atab.active {
  background:rgba(124,58,237,0.28);
  border-color:rgba(192,132,252,0.5);
  color:#c084fc;
}

.add-pane { width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px; }

.form-label { font-size:13px; color:rgba(255,255,255,0.55); margin-bottom:4px; }

.form-input {
  width:100%; padding:14px; border-radius:14px;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
  color:#fff; font-size:16px; outline:none;
}
.form-input:focus { border-color:rgba(192,132,252,0.5); }
.form-input::placeholder { color:rgba(255,255,255,0.3); }
.form-input.needs-name { border-color:rgba(251,191,36,0.7); animation:pulse-border 1.2s ease-in-out 2; }
@keyframes pulse-border { 0%,100%{border-color:rgba(251,191,36,0.7)} 50%{border-color:rgba(251,191,36,1); box-shadow:0 0 10px rgba(251,191,36,0.4)} }

.format-tip {
  background:rgba(192,132,252,0.1); border:1px solid rgba(192,132,252,0.2);
  border-radius:12px; padding:10px 14px;
  font-size:12px; color:rgba(255,255,255,0.7); line-height:1.6;
  direction:ltr; text-align:left;
}

.words-textarea {
  width:100%; height:200px; padding:12px;
  border-radius:14px;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
  color:#fff; font-size:13px; font-family:monospace;
  outline:none; resize:vertical; direction:ltr;
}
.words-textarea:focus { border-color:rgba(192,132,252,0.5); }
.words-textarea::placeholder { color:rgba(255,255,255,0.25); }

.parse-preview {
  background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.25);
  border-radius:12px; padding:10px 14px;
  font-size:13px; color:rgba(255,255,255,0.8);
  display:none;
}
.parse-preview.on { display:block; }
.parse-error { background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.3); }

.btn-create {
  padding:16px; border:none; border-radius:16px;
  background:linear-gradient(135deg,#7c3aed,#4338ca);
  color:#fff; font-size:18px; font-weight:800; cursor:pointer;
  box-shadow:0 8px 24px rgba(124,58,237,0.45);
}
.btn-create:disabled { opacity:0.4; cursor:not-allowed; }

/* ══ PHOTO PANE ══ */
.photo-meta-row { display:flex; gap:10px; }
.photo-meta-row > div { flex:1; }

.photo-dropzone {
  width:100%; padding:32px 16px;
  border:2px dashed rgba(255,255,255,0.22);
  border-radius:20px; background:rgba(255,255,255,0.04);
  text-align:center; cursor:pointer; transition:all .2s;
}
.photo-dropzone:active { background:rgba(255,255,255,0.1); border-color:#c084fc; }
.pdz-icon { font-size:42px; margin-bottom:8px; }
.pdz-main { color:rgba(255,255,255,0.75); font-size:16px; font-weight:700; }
.pdz-sub  { font-size:12px; color:rgba(255,255,255,0.35); margin-top:4px; }

.photo-thumb {
  width:100%; max-height:220px;
  object-fit:contain; border-radius:14px;
  border:1px solid rgba(255,255,255,0.1);
}

.ocr-status {
  padding:11px 14px;
  background:rgba(192,132,252,0.1); border:1px solid rgba(192,132,252,0.2);
  border-radius:12px; font-size:13px; color:rgba(255,255,255,0.85);
  text-align:center; line-height:1.5;
}
@keyframes spin { to { transform:rotate(360deg); } }
.ocr-spin { display:inline-block; animation:spin 1s linear infinite; }

/* word review list */
.review-hdr {
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 2px; font-size:13px; color:rgba(255,255,255,0.65); font-weight:700;
}
.review-hint { font-size:11px; color:rgba(255,255,255,0.3); font-weight:400; }

.rrow {
  display:flex; align-items:center; gap:8px;
  padding:7px 4px; border-bottom:1px solid rgba(255,255,255,0.06);
}
.rrow-e  { font-size:18px; flex-shrink:0; width:26px; text-align:center; }
.rrow-en { font-size:13px; font-weight:700; flex:1.1; direction:ltr; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rrow-he {
  flex:1; padding:5px 8px;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);
  border-radius:8px; color:#fff; font-size:13px; outline:none; min-width:0;
  direction:rtl; text-align:right;
}
.rrow-he:focus { border-color:rgba(192,132,252,0.5); }
.rrow-he::placeholder { color:rgba(255,255,255,0.25); }
.rrow-x {
  background:none; border:none; color:rgba(255,255,255,0.22);
  font-size:13px; cursor:pointer; flex-shrink:0; padding:4px 2px;
}
.rrow-x:active { color:#ef4444; }

/* ══ GAME ══ */
#s-game { padding-top:14px; justify-content:flex-start; }

.g-top { display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:10px; }
.g-setname { font-size:13px; color:rgba(255,255,255,0.5); font-weight:600; }
.g-score { font-size:13px; color:rgba(255,255,255,0.4); }
.g-score strong { color:#c084fc; font-size:16px; }

.gbar-wrap { width:100%; height:5px; background:rgba(255,255,255,0.08); border-radius:3px; margin-bottom:14px; overflow:hidden; }
.gbar { height:100%; background:linear-gradient(90deg,#10b981,#c084fc); border-radius:3px; transition:width .6s ease; min-width:3px; }

.wcard {
  width:100%;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:24px; padding:18px 16px 14px; text-align:center; margin-bottom:14px;
}
.wc-emoji { font-size:44px; line-height:1; margin-bottom:4px; }
.wc-part  { font-size:10px; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px; }
.wc-word  { font-weight:900; line-height:1.1; direction:ltr; }

.speak-btn {
  display:inline-flex; align-items:center; gap:6px; margin-top:8px;
  padding:5px 14px; background:rgba(255,255,255,0.09);
  border:1px solid rgba(255,255,255,0.18); border-radius:20px;
  color:rgba(255,255,255,0.7); font-size:13px; cursor:pointer; transition:all .15s;
}
.speak-btn:active { transform:scale(0.95); }
.speak-btn.speaking { color:#c084fc; border-color:#c084fc; }

.hint-box {
  margin-top:9px; background:rgba(192,132,252,0.1); border:1px solid rgba(192,132,252,0.18);
  border-radius:12px; padding:7px 12px;
  font-size:13px; color:rgba(255,255,255,0.8); line-height:1.5; text-align:right; direction:rtl;
}
.hint-box:empty { display:none; }

.hit-dots { display:flex; justify-content:center; gap:10px; margin-top:11px; }
.hdot { width:11px; height:11px; border-radius:50%; border:2px solid rgba(255,255,255,0.22); transition:all .3s; }
.hdot.on { background:#c084fc; border-color:#c084fc; box-shadow:0 0 7px #c084fc88; }

.opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }
.opt {
  padding:17px 8px; min-height:62px;
  border:2px solid rgba(255,255,255,0.12); border-radius:16px;
  background:rgba(255,255,255,0.055); color:#fff; font-size:15px; font-weight:700;
  cursor:pointer; transition:all .12s; line-height:1.3;
}
.opt:active { transform:scale(0.96); }
.opt.ok  { background:rgba(16,185,129,.22); border-color:#10b981; animation:opop .35s; }
.opt.bad { background:rgba(239,68,68,.22);  border-color:#ef4444; animation:oshk .4s; }
.opt.rev { background:rgba(16,185,129,.14); border-color:rgba(16,185,129,.5); }

@keyframes opop { 0%{transform:scale(1)} 50%{transform:scale(1.07)} 100%{transform:scale(1)} }
@keyframes oshk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

.mflash {
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  background:rgba(16,185,129,0.08); pointer-events:none; opacity:0; transition:opacity .2s;
}
.mflash.on { opacity:1; }
.mbadge {
  background:linear-gradient(135deg,#10b981,#059669); border-radius:20px; padding:16px 32px;
  font-size:22px; font-weight:900; box-shadow:0 12px 40px rgba(16,185,129,.4);
  animation:bigpop .3s ease;
}
@keyframes bigpop { 0%{transform:scale(.4);opacity:0} 70%{transform:scale(1.08)} 100%{transform:scale(1)} }

/* WIN */
#s-win { justify-content:center; gap:18px; padding-top:40px; }
.wtrophy { font-size:80px; animation:bounce 1.5s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-13px)} }
.wtitle { font-size:30px; font-weight:900; text-align:center; }
.wsub   { font-size:14px; color:rgba(255,255,255,0.55); text-align:center; }
.wstats { display:flex; gap:24px; }
.wstat  { text-align:center; }
.wstat .n { font-size:28px; font-weight:900; }
.wstat .l { font-size:11px; color:rgba(255,255,255,0.45); }
.btn-again {
  padding:15px 34px; border:none; border-radius:16px;
  background:linear-gradient(135deg,#7c3aed,#4338ca);
  color:#fff; font-size:17px; font-weight:800; cursor:pointer;
  box-shadow:0 8px 24px rgba(124,58,237,.4);
}
.btn-home {
  padding:11px; border:none; border-radius:13px; max-width:220px; width:100%;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14);
  color:rgba(255,255,255,0.65); font-size:14px; font-weight:600; cursor:pointer;
}

.cf { position:fixed; border-radius:2px; pointer-events:none; z-index:200; animation:cfFall linear forwards; }
@keyframes cfFall { to{transform:translateY(110vh) rotate(720deg);opacity:0;} }

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }

/* toast */
.toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
  background:rgba(30,20,70,0.96); border:1px solid rgba(255,255,255,0.15);
  border-radius:14px; padding:12px 22px;
  font-size:14px; font-weight:600; color:#fff;
  z-index:300; opacity:0; transition:all .3s; white-space:nowrap; pointer-events:none;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;overflow:hidden">
  <defs>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
</svg>

<!-- ══ HOME ══ -->
<div id="s-home" class="screen on">
  <div class="app-header">
    <div class="title">WordUp! 🚀</div>
    <div class="subtitle">לימוד מילות אנגלית</div>
  </div>
  <div class="sets-list" id="setsList"></div>
<div class="toast" id="toast"></div>
  <button class="btn-add" onclick="go('add')">＋ הוסף סט מילים חדש</button>
</div>

<!-- ══ ADD SET ══ -->
<div id="s-add" class="screen">
  <div class="add-topbar">
    <button class="btn-back" onclick="go('home')">← חזור</button>
    <h2>סט מילים חדש</h2>
  </div>

  <!-- Tabs -->
  <div class="add-tabs">
    <button class="atab active" id="atab-text"  onclick="switchAddTab('text')">📝 הדבק טקסט</button>
    <button class="atab"        id="atab-photo" onclick="switchAddTab('photo')">📷 צלם מהספר</button>
  </div>

  <!-- ── TEXT PANE ── -->
  <div id="apane-text" class="add-pane">
    <div>
      <div class="form-label">שם הסט</div>
      <input id="setNameInput" class="form-input" type="text" placeholder='לדוגמה: כיתה ו — סט 2' oninput="updatePreview()">
    </div>
    <div>
      <div class="form-label">הדבק מילים</div>
      <div class="format-tip">
        פורמט נתמך (כל שורה):<br>
        <b>english</b> [Tab] <b>עברית</b><br>
        או הפורמט המלא: english [Tab] חלק דיבר [Tab] קטגוריה [Tab] עברית
      </div>
      <textarea id="wordsInput" class="words-textarea"
        placeholder="above&#9;מעל&#10;address&#9;כתובת&#10;after&#9;אחרי"
        oninput="updatePreview()"></textarea>
    </div>
    <div class="parse-preview" id="parsePreview"></div>
    <button class="btn-create" id="btnCreate" onclick="createSet()" disabled>✅ צור סט</button>
  </div>

  <!-- ── PHOTO PANE ── -->
  <div id="apane-photo" class="add-pane" style="display:none">

    <!-- class + student name -->
    <div class="photo-meta-row">
      <div>
        <div class="form-label">כיתה</div>
        <input id="photoClass" class="form-input" type="text" placeholder="ה'1" style="text-align:center" oninput="updatePhotoBtnState()">
      </div>
      <div>
        <div class="form-label">שם תלמיד</div>
        <input id="photoStudent" class="form-input" type="text" placeholder="שם" oninput="updatePhotoBtnState()">
      </div>
    </div>

    <!-- hidden file input -->
    <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="handlePhotoSelect(this)">

    <!-- drop zone -->
    <div class="photo-dropzone" id="photoDropZone" onclick="document.getElementById('photoFile').click()">
      <div class="pdz-icon">📷</div>
      <div class="pdz-main">צלם או בחר תמונה</div>
      <div class="pdz-sub">דף מהספר / דף מודפס / לוח</div>
    </div>

    <!-- thumbnail -->
    <img id="photoThumb" class="photo-thumb" style="display:none" alt="">

    <!-- status -->
    <div id="ocrStatus" class="ocr-status" style="display:none"></div>

    <!-- word review list -->
    <div id="wordReviewList"></div>

    <!-- create button -->
    <button class="btn-create" id="btnCreatePhoto" onclick="createSetFromPhoto()" disabled style="display:none">✅ צור סט</button>

  </div>
</div>

<!-- ══ GAME ══ -->
<div id="s-game" class="screen">
  <div class="g-top">
    <div class="g-setname" id="gSetName">סט 1</div>
    <div class="g-score">נלמדו <strong id="gMastN">0</strong>/<span id="gTotal">0</span></div>
  </div>
  <div class="gbar-wrap"><div class="gbar" id="gbar" style="width:0%"></div></div>
  <div class="wcard">
    <div class="wc-emoji" id="wcEmoji">📝</div>
    <div class="wc-part"  id="wcPart"></div>
    <div class="wc-word"  id="wcWord"></div>
    <button class="speak-btn" id="speakBtn" onclick="speakWord()">🔊 שמע הגייה</button>
    <div class="hint-box" id="hintBox"></div>
    <div class="hit-dots"><div class="hdot" id="d0"></div><div class="hdot" id="d1"></div></div>
  </div>
  <div class="opts" id="optsGrid"></div>
</div>

<div class="mflash" id="mflash">
  <div class="mbadge" id="mbadgeTxt">✅ נלמד!</div>
</div>

<!-- ══ WIN ══ -->
<div id="s-win" class="screen">
  <div class="wtrophy">🏆</div>
  <div class="wtitle">סיימת את הסט! 🎉</div>
  <div class="wsub" id="winSub"></div>
  <div class="wstats">
    <div class="wstat"><div class="n" id="wTot" style="color:#c084fc">0</div><div class="l">מילים</div></div>
    <div class="wstat"><div class="n" id="wOk"  style="color:#10b981">0</div><div class="l">נכון</div></div>
    <div class="wstat"><div class="n" id="wBad" style="color:#ef4444">0</div><div class="l">טעויות</div></div>
  </div>
  <button class="btn-again" onclick="restartCurrentSet()">🔄 שחק שוב</button>
  <button class="btn-home"  onclick="go('home')">🏠 בחר סט</button>
</div>

<script>
/* ══════════════════════════════════════════════════
   BUILT-IN DEFAULT SET (103 words + emoji + hint)
══════════════════════════════════════════════════ */
const DEFAULT_WORDS = [
  {en:"above",he:"מעל",p:"מילת יחס",e:"✈️",hint:"המטוס טס above = מעל העננים"},
  {en:"address",he:"כתובת",p:"שם עצם",e:"📮",hint:"הכתובת כתובה על המעטפה ✉️"},
  {en:"after",he:"אחרי",p:"מילת יחס",e:"⏩",hint:"after school = אחרי בית הספר"},
  {en:"already",he:"כבר",p:"תואר הפועל",e:"✅",hint:"already done! = כבר גמרתי!"},
  {en:"alone",he:"לבד",p:"תואר",e:"🧍",hint:"home alone = לבד בבית"},

const BUILT_IN = {};
DEFAULT_WORDS.forEach(w => { BUILT_IN[w.en.toLowerCase()] = w; });

/* ══════════════════════════════════════════════════
   SETS & STORAGE
══════════════════════════════════════════════════ */
const DEFAULT_SET_ID = 'default';
let userSets = [];
let allHits  = {};

function loadStorage() {
  try { userSets = JSON.parse(localStorage.getItem('wu6_sets') || '[]'); } catch(e) { userSets = []; }
  try { allHits  = JSON.parse(localStorage.getItem('wu6_hits') || '{}'); } catch(e) { allHits = {}; }
}
function saveStorage() {
  localStorage.setItem('wu6_sets', JSON.stringify(userSets));
  localStorage.setItem('wu6_hits', JSON.stringify(allHits));
}

function getAllSets() {
  return [
    { id: DEFAULT_SET_ID, name: 'כיתה ו — סט 1 (ברירת מחדל)', words: DEFAULT_WORDS },
    ...userSets
  ];
}

function getHits(setId)      { return allHits[setId] || {}; }
function setHit(setId,en,n)  { if(!allHits[setId]) allHits[setId]={}; allHits[setId][en]=n; saveStorage(); }
function resetSetHits(setId) { allHits[setId]={}; saveStorage(); }
function mastCount(setId, words) {
  const h = getHits(setId);
  return words.filter(w => (h[w.en]||0) >= 2).length;
}

/* ══════════════════════════════════════════════════
   TEXT IMPORT PARSER
══════════════════════════════════════════════════ */
function parseWords(text) {
  const lines = text.trim().split('\n');
  const out = [];
  for (const line of lines) {
    const raw = line.trim();
    if (!raw) continue;
    const parts = raw.split('\t');
    let en='', he='', p='';
    if (parts.length >= 4) {
      en = parts[0].trim(); p = parts[1].trim(); he = parts[3].trim();
    } else if (parts.length >= 2) {
      en = parts[0].trim(); he = parts[1].trim();
      if (parts[2]) p = parts[2].trim();
    } else {
      const pp = raw.split('|');
      if (pp.length >= 2) { en = pp[0].trim(); he = pp[1].trim(); }
    }
    if (!en || !he) continue;
    const known = BUILT_IN[en.toLowerCase()];
    out.push(known ? { ...known } : { en, he, p, e: '📝', hint: he });
  }
  return out;
}

/* ══════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════ */
function go(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById('s-' + name).classList.add('on');
  if (name === 'home') renderHome();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════════════════
   HOME SCREEN
══════════════════════════════════════════════════ */
function renderHome() {
  const list = document.getElementById('setsList');
  list.innerHTML = '';
  getAllSets().forEach(set => {
    const mast   = mastCount(set.id, set.words);
    const total  = set.words.length;
    const pct    = total ? (mast / total * 100) : 0;
    const almost = set.words.filter(w => (getHits(set.id)[w.en]||0) === 1).length;
    const isDefault = set.id === DEFAULT_SET_ID;

    const card = document.createElement('div');
    card.className = 'set-card';
    card.innerHTML = `
      <div class="set-card-top">
        <div class="set-name">📚 ${escHtml(set.name)}</div>
        <div style="display:flex;gap:2px">
          <button class="set-share" onclick="shareSet('${set.id}')" title="שתף סט">📤</button>
          ${isDefault ? '' : `<button class="set-del" onclick="deleteSet('${set.id}')" title="מחק סט">🗑</button>`}
        </div>
      </div>
      <div class="set-bar-wrap"><div class="set-bar" style="width:${pct}%"></div></div>
      <div class="set-stats">
        <div class="set-nums">
          <strong>${mast}</strong>/${total} נלמדו
          ${almost ? ` · ${almost} כמעט` : ''}
        </div>
        <button class="btn-play-set" onclick="startSet('${set.id}')">▶ למד</button>
      </div>`;
    list.appendChild(card);
  });
}

function deleteSet(id) {
  if (!confirm('למחוק את הסט הזה?')) return;
  userSets = userSets.filter(s => s.id !== id);
  delete allHits[id];
  saveStorage();
  renderHome();
}

/* ══════════════════════════════════════════════════
   SHARE / IMPORT VIA URL
══════════════════════════════════════════════════ */
function shareSet(id) {
  const set = getAllSets().find(s => s.id === id);
  if (!set) return;

  // Compact encode: "name\nen|he\nen|he..."
  const lines = [set.name, ...set.words.map(w => `${w.en}|${w.he}`)].join('\n');
  const encoded = btoa(unescape(encodeURIComponent(lines)));
  const url = location.origin + location.pathname + '?s=' + encoded;

  if (navigator.share) {
    navigator.share({ title: 'WordUp — ' + set.name, url })
      .catch(() => copyToClipboard(url));
  } else {
    copyToClipboard(url);
  }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text)
    .then(() => showToast('📋 הקישור הועתק — שלח בוואטסאפ!'))
    .catch(() => {
      prompt('העתק את הקישור:', text);
    });
}

function showToast(msg, ms = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function importFromURL() {
  const params = new URLSearchParams(location.search);
  const s = params.get('s');
  if (!s) return;

  try {
    const lines = decodeURIComponent(escape(atob(s))).split('\n');
    const name  = lines[0];
    const words = [];
    for (let i = 1; i < lines.length; i++) {
      const [en, he] = lines[i].split('|');
      if (!en || !he) continue;
      const known = BUILT_IN[en.toLowerCase()];
      words.push(known ? { ...known } : { en, he, p:'', e:'📝', hint: he });
    }
    if (name && words.length) {
      const alreadyHave = userSets.some(x => x.name === name);
      if (!alreadyHave) {
        userSets.push({ id: 'set_' + Date.now(), name, words });
        saveStorage();
        showToast(`✅ הסט "${name}" נוסף!`);
        renderHome();
      } else {
        showToast(`הסט "${name}" כבר קיים`);
      }
    }
  } catch(e) {}

  history.replaceState(null, '', location.pathname);
}

let photoWords = [];

async function handlePhotoSelect(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  // Show thumbnail
  const thumb = document.getElementById('photoThumb');
  thumb.src = URL.createObjectURL(file);
  thumb.style.display = 'block';

  photoWords = [];
  document.getElementById('wordReviewList').innerHTML = '';
  document.getElementById('btnCreatePhoto').style.display = 'none';

  setOcrStatus('🔍 שולח תמונה לניתוח...', true);

  try {
    const resized = await resizeImage(file, 1600);
    const text    = await ocrImage(resized);

    const rawWords = extractWordsFromOCRText(text);
    if (!rawWords.length) {
      setOcrStatus('❌ לא זוהו מילים בתמונה. נסה תמונה ברורה יותר.', false);
      return;
    }

    setOcrStatus(`✅ זוהו ${rawWords.length} מילים. מתרגם...`, true);

    const toTranslate = [];
    for (const en of rawWords) {
      const known = BUILT_IN[en.toLowerCase()];
      if (known) {
        photoWords.push({ ...known });
      } else {
        const w = { en, he: '', p: '', e: '📝', hint: '' };
        photoWords.push(w);
        toTranslate.push(w);
      }
    }

    renderWordReview();

    if (toTranslate.length > 0) {
      await translateBatch(toTranslate);
    }

    setOcrStatus(`✅ ${photoWords.length} מילים — ניתן לערוך ולמחוק`, false);
    document.getElementById('btnCreatePhoto').style.display = '';
    updatePhotoBtnState();

  } catch(err) {
    setOcrStatus('❌ שגיאה בניתוח: ' + (err.message || 'נסה שוב'), false);
  }
}

/* Resize image via canvas before upload */
function resizeImage(file, maxPx) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxPx || h > maxPx) {
        if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
        else       { w = Math.round(w * maxPx / h); h = maxPx; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(blob => resolve(blob || file), 'image/jpeg', 0.88);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

/* OCR via OCR.space free API */
async function ocrImage(blob) {
  const fd = new FormData();
  fd.append('file', blob, 'page.jpg');
  fd.append('apikey', 'helloworld');
  fd.append('language', 'eng');
  fd.append('scale', 'true');
  fd.append('isTable', 'true');
  fd.append('OCREngine', '2');

  const res = await fetch('https://api.ocr.space/parse/image', { method:'POST', body:fd });
  if (!res.ok) throw new Error('שגיאת רשת');
  const data = await res.json();
  if (data.IsErroredOnProcessing) throw new Error(data.ErrorMessage?.[0] || 'OCR error');
  if (!data.ParsedResults?.length)  throw new Error('no results');
  return data.ParsedResults[0].ParsedText || '';
}

/* Extract English words/phrases from OCR text */
function extractWordsFromOCRText(text) {
  const STOP = new Set([
    'a','an','the','is','are','was','were','it','to','of','in','on','at','be','by',
    'or','if','up','as','do','go','no','so','we','he','she','they','you','i','me',
    'my','his','her','our','its','not','for','and','but','n','s','r','parts','check',
    'unit','look','find','least','two','words','phrases','each','following','which',
    'word','doesn','follow','bold','choose','correct','answers'
  ]);

  const seen = new Set();
  const out  = [];

  for (const rawLine of text.split('\n')) {
    // split on 2+ spaces or tabs (column separators)
    for (const chunk of rawLine.split(/\t|\s{2,}/)) {
      let w = chunk.trim().toLowerCase();
      // keep letters, spaces, apostrophes, hyphens, parentheses
      w = w.replace(/[^a-z\s()'.-]/g, '').replace(/\s+/g, ' ').trim();
      if (w.length < 2)         continue;
      if (!/[a-z]{2}/.test(w)) continue;
      if (STOP.has(w))          continue;
      if (seen.has(w))          continue;
      // skip lines that are clearly sentences (>5 words)
      if (w.split(' ').length > 5) continue;
      seen.add(w);
      out.push(w);
    }
  }

  return out;
}

/* Auto-translate unknown words via MyMemory */
async function translateBatch(wordObjs) {
  for (let i = 0; i < wordObjs.length; i++) {
    const w = wordObjs[i];
    try {
      const r = await fetch(
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(w.en)}&langpair=en|he`
      );
      const d = await r.json();
      if (d.responseStatus === 200) {
        const t = (d.responseData.translatedText || '').trim();
        // sanity-check: should contain Hebrew chars
        if (t && /[א-ת]/.test(t)) {
          w.he = t; w.hint = t;
        }
      }
    } catch(e) {}

    if (i % 5 === 4) renderWordReview();
    await pause(140);
  }
  renderWordReview();
}

function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

function setOcrStatus(msg, loading) {
  const el = document.getElementById('ocrStatus');

}

      <div class="rrow">

          oninput="photoWords[${i}].he=this.value;updatePhotoBtnState()">
        <button class="rrow-x" onclick="photoWords.splice(${i},1);renderWordReview();updatePhotoBtnState()">✕</button>

/* ══════════════════════════════════════════════════
   GAME
══════════════════════════════════════════════════ */
let curSetId = null, curWords = [], curSetName = '';
let gamePool = [], gameCur = null, gameLocked = false;
let gameOk = 0, gameBad = 0;

function startSet(setId) {
  const set = getAllSets().find(s => s.id === setId);
  if (!set) return;
  curSetId   = setId;
  curWords   = set.words;
  curSetName = set.name;
  gameOk = 0; gameBad = 0;
  gamePool = buildPool();
  go('game');
  nextWord();
}

function restartCurrentSet() {
  resetSetHits(curSetId);
  startSet(curSetId);
}

function activePool() {
  const h = getHits(curSetId);
  return curWords.filter(w => (h[w.en]||0) < 2);
}

function buildPool() {
  const active = activePool();
  if (!active.length) return [];
  const bag = [];
  const h = getHits(curSetId);
  active.forEach(w => {
    const n = (h[w.en]||0) === 0 ? 3 : 2;
    for (let i=0; i<n; i++) bag.push(w);
  });
  return shuffle(bag);
}

function nextWord() {
  gameLocked = false;
  if (!gamePool.length) gamePool = buildPool();
  if (!gamePool.length) { showWin(); return; }
  gameCur = gamePool.shift();
  renderWord();
}

function renderWord() {
  const w = gameCur;
  const h = getHits(curSetId);
  const mast = mastCount(curSetId, curWords);

  document.getElementById('gSetName').textContent = curSetName;
  document.getElementById('gMastN').textContent   = mast;
  document.getElementById('gTotal').textContent   = curWords.length;
  document.getElementById('gbar').style.width     = (mast / curWords.length * 100) + '%';

  const hits = h[w.en] || 0;
  const firstTime = hits === 0;

  const emojiEl = document.getElementById('wcEmoji');
  emojiEl.textContent  = w.e || '📝';
  emojiEl.style.display = firstTime ? '' : 'none';
  document.getElementById('wcPart').textContent   = firstTime ? (w.p || '') : '';
  document.getElementById('hintBox').textContent  = firstTime ? (w.hint || '') : '';

  const el = document.getElementById('wcWord');
  el.textContent = w.en;
  el.style.fontSize = w.en.length > 14 ? '24px' : w.en.length > 9 ? '32px' : '42px';

  document.getElementById('d0').className = 'hdot' + (hits >= 1 ? ' on' : '');
  document.getElementById('d1').className = 'hdot' + (hits >= 2 ? ' on' : '');

  const pool  = curWords.length >= 4 ? curWords : DEFAULT_WORDS;
  const others = shuffle(pool.filter(x => x.en !== w.en)).slice(0, 3);
  const opts   = shuffle([w, ...others]);
  const grid   = document.getElementById('optsGrid');
  grid.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.he;
    btn.onclick = () => answer(btn, opt);
    grid.appendChild(btn);
  });

  autoSpeak();
}

function answer(btn, chosen) {
  if (gameLocked) return;
  gameLocked = true;
  const h    = getHits(curSetId);
  const correct = chosen.en === gameCur.en;

  if (correct) {
    btn.classList.add('ok');
    sndOk(); gameOk++;
    const prev = h[gameCur.en] || 0;
    setHit(curSetId, gameCur.en, prev + 1);
    if (prev + 1 >= 2) setTimeout(() => flashMastered(gameCur.en), 180);
    else setTimeout(nextWord, 620);
  } else {
    btn.classList.add('bad');
    document.querySelectorAll('.opt').forEach(b => { if (b.textContent === gameCur.he) b.classList.add('rev'); });
    sndBad(); gameBad++;
    gamePool.splice(Math.min(3, gamePool.length), 0, gameCur);
    setTimeout(nextWord, 1300);
  }

  const hNew = (h[gameCur.en] || 0) + (correct ? 1 : 0);
  document.getElementById('d0').className = 'hdot' + (hNew >= 1 ? ' on' : '');
}

function flashMastered(en) {
  sndMast();
  document.getElementById('mbadgeTxt').textContent = '✅ "' + en + '" — נלמד!';
  const fl = document.getElementById('mflash');
  fl.classList.add('on');
  confetti(26);
  setTimeout(() => {
    fl.classList.remove('on');
    if (!activePool().length) setTimeout(showWin, 250);
    else nextWord();
  }, 1400);
}

function showWin() {
  sndWin();
  document.getElementById('wTot').textContent = curWords.length;
  document.getElementById('wOk').textContent  = gameOk;
  document.getElementById('wBad').textContent = gameBad;
  document.getElementById('winSub').textContent = 'כל ' + curWords.length + ' המילות ב"' + curSetName + '"';
  go('win');
  confetti(90);
}

/* ══════════════════════════════════════════════════
   SPEECH
══════════════════════════════════════════════════ */
function speakWord() {
  if (!window.speechSynthesis || !gameCur) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(gameCur.en);
  utt.lang = 'en-US'; utt.rate = 0.82; utt.pitch = 1;
  const btn = document.getElementById('speakBtn');
  btn.classList.add('speaking');
  utt.onend = utt.onerror = () => btn.classList.remove('speaking');
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.startsWith('en')) || null;
  if (enVoice) utt.voice = enVoice;
  window.speechSynthesis.speak(utt);
}
function autoSpeak() { setTimeout(speakWord, 400); }

/* ══════════════════════════════════════════════════
   AUDIO
══════════════════════════════════════════════════ */
let actx;
function beep(f,d,t='sine',v=0.25) {
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type=t; o.frequency.value=f;
    g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);
    o.start(); o.stop(actx.currentTime+d);
  } catch(e) {}
}
const sndOk  = ()=>{beep(523,.08);setTimeout(()=>beep(659,.08),65);setTimeout(()=>beep(784,.2),130);};
const sndBad = ()=>beep(160,.35,'sawtooth',.14);
const sndMast= ()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*75));
const sndWin = ()=>[523,587,659,784,880,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*90));

/* ══════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════ */
function shuffle(a) {
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function confetti(n) {
  const cols=['#c084fc','#818cf8','#38bdf8','#10b981','#f59e0b','#ef4444','#fff'];
  for(let i=0;i<n;i++) setTimeout(()=>{
    const el=document.createElement('div');
    el.className='cf';
    const s=6+Math.random()*9;
    el.style.cssText=`left:${Math.random()*100}vw;top:-14px;width:${s}px;height:${s}px;`
      +`background:${cols[~~(Math.random()*cols.length)]};`
      +`border-radius:${Math.random()>.5?'50%':'2px'};`
      +`animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.5}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }, i*22);
}
