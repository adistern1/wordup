<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordUp! 🚀</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html {
  min-height: 100%;
  background: linear-gradient(160deg, #120a2e 0%, #1e1050 45%, #0d1a3a 100%);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  min-height: 100vh;
  background: transparent;
}

.screen { display: none; }
.screen.on {
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding: 0 18px 28px;
}

/* ── HOME ── */
#s-home { padding-top: 36px; }

.title {
  font-size: 50px; font-weight: 900; letter-spacing: -2px; text-align: center;
  background: linear-gradient(135deg, #c084fc, #818cf8, #38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.subtitle { font-size: 14px; color: rgba(255,255,255,0.45); text-align: center; margin-top: 3px; margin-bottom: 28px; }

.prog-section { display:flex; flex-direction:column; align-items:center; gap:16px; flex:1; justify-content:center; width:100%; }

.ring-wrap { position:relative; width:154px; height:154px; }
.ring-wrap svg { display:block; transform:rotate(-90deg); }
.ring-bg   { fill:none; stroke:rgba(255,255,255,0.09); stroke-width:12; }
.ring-fill { fill:none; stroke:url(#rg); stroke-width:12; stroke-linecap:round; transition:stroke-dashoffset 1s ease; }
.ring-center {
  position:absolute; top:0; left:0; right:0; bottom:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.ring-n   { font-size:36px; font-weight:900; color:#c084fc; line-height:1; }
.ring-lbl { font-size:11px; color:rgba(255,255,255,0.4); margin-top:3px; }

.legend { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
.leg { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
.ldot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

.home-btns { display:flex; flex-direction:column; gap:11px; width:100%; max-width:300px; margin-top:28px; }

.btn-play {
  padding:18px; border:none; border-radius:18px;
  background:linear-gradient(135deg,#7c3aed,#4338ca);
  color:#fff; font-size:20px; font-weight:800; cursor:pointer;
  box-shadow:0 8px 28px rgba(124,58,237,0.5);
  transition:transform .12s;
}
.btn-play:active { transform:scale(0.97); }

.btn-sec {
  padding:12px; border:none; border-radius:14px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.14);
  color:rgba(255,255,255,0.6); font-size:14px; font-weight:600; cursor:pointer;
}

/* ── GAME ── */
#s-game { padding-top:16px; justify-content:flex-start; }

.g-top {
  display:flex; align-items:center; justify-content:space-between;
  width:100%; margin-bottom:10px;
}
.g-learned { font-size:14px; font-weight:700; color:rgba(255,255,255,0.65); }
.g-learned strong { color:#c084fc; font-size:17px; }
.g-remain  { font-size:12px; color:rgba(255,255,255,0.38); }

.gbar-wrap { width:100%; height:5px; background:rgba(255,255,255,0.08); border-radius:3px; margin-bottom:16px; overflow:hidden; }
.gbar { height:100%; background:linear-gradient(90deg,#10b981,#c084fc); border-radius:3px; transition:width .6s ease; min-width:3px; }

/* word card */
.wcard {
  width:100%;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:24px; padding:20px 18px 16px;
  text-align:center; margin-bottom:16px;
}
.wc-emoji { font-size:48px; line-height:1; margin-bottom:6px; }
.wc-part  { font-size:10px; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px; }
.wc-word  { font-weight:900; line-height:1.1; direction:ltr; }

.speak-btn {
  display:inline-flex; align-items:center; justify-content:center;
  margin-top:8px; padding:6px 14px; gap:6px;
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
  border-radius:20px; color:rgba(255,255,255,0.75); font-size:14px;
  cursor:pointer; transition:all .15s;
}
.speak-btn:active { transform:scale(0.95); background:rgba(255,255,255,0.18); }
.speak-btn.speaking { color:#c084fc; border-color:#c084fc; background:rgba(192,132,252,0.15); }

.hint-box {
  margin-top:10px;
  background:rgba(192,132,252,0.1);
  border:1px solid rgba(192,132,252,0.2);
  border-radius:12px; padding:8px 12px;
  font-size:13px; color:rgba(255,255,255,0.82);
  line-height:1.5; text-align:right;
  direction:rtl;
}

.hit-dots { display:flex; justify-content:center; gap:10px; margin-top:12px; }
.hdot {
  width:11px; height:11px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.25); transition:all .3s;
}
.hdot.on { background:#c084fc; border-color:#c084fc; box-shadow:0 0 7px #c084fc88; }

/* options */
.opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }
.opt {
  padding:17px 8px; min-height:62px;
  border:2px solid rgba(255,255,255,0.12);
  border-radius:16px;
  background:rgba(255,255,255,0.055);
  color:#fff; font-size:15px; font-weight:700;
  cursor:pointer; transition:all .12s; line-height:1.3;
}
.opt:active { transform:scale(0.96); }
.opt.ok  { background:rgba(16,185,129,.22); border-color:#10b981; animation:opop .35s; }
.opt.bad { background:rgba(239,68,68,.22);  border-color:#ef4444; animation:oshk .4s; }
.opt.rev { background:rgba(16,185,129,.14); border-color:rgba(16,185,129,.5); }

@keyframes opop { 0%{transform:scale(1)} 50%{transform:scale(1.07)} 100%{transform:scale(1)} }
@keyframes oshk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

/* mastered flash */
.mflash {
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(16,185,129,0.1);
  pointer-events:none; opacity:0; transition:opacity .2s;
}
.mflash.on { opacity:1; }
.mbadge {
  background:linear-gradient(135deg,#10b981,#059669);
  border-radius:20px; padding:16px 32px;
  font-size:24px; font-weight:900;
  box-shadow:0 12px 40px rgba(16,185,129,.45);
  animation:bigpop .3s ease;
}
@keyframes bigpop { 0%{transform:scale(.4);opacity:0} 70%{transform:scale(1.08)} 100%{transform:scale(1)} }

/* WIN */
#s-win { justify-content:center; gap:20px; padding-top:40px; }
.wtrophy { font-size:82px; animation:bounce 1.5s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-13px)} }
.wtitle { font-size:32px; font-weight:900; text-align:center; }
.wsub   { font-size:14px; color:rgba(255,255,255,0.55); text-align:center; }
.wstats { display:flex; gap:24px; }
.wstat  { text-align:center; }
.wstat .n { font-size:30px; font-weight:900; }
.wstat .l { font-size:11px; color:rgba(255,255,255,0.45); }
.btn-again {
  padding:16px 36px; border:none; border-radius:16px;
  background:linear-gradient(135deg,#7c3aed,#4338ca);
  color:#fff; font-size:18px; font-weight:800; cursor:pointer;
  box-shadow:0 8px 28px rgba(124,58,237,.45);
}

/* confetti */
.cf { position:fixed; border-radius:2px; pointer-events:none; z-index:200; animation:cfFall linear forwards; }
@keyframes cfFall { to { transform:translateY(110vh) rotate(720deg); opacity:0; } }

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;overflow:hidden">
  <defs>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
</svg>

<!-- HOME -->
<div id="s-home" class="screen on">
  <div class="title">WordUp! 🚀</div>
  <div class="subtitle">לימוד מילות אנגלית — כיתה ו'</div>

  <div class="prog-section">
    <div class="ring-wrap">
      <svg width="154" height="154" viewBox="0 0 154 154">
        <circle class="ring-bg"   cx="77" cy="77" r="65"/>
        <circle class="ring-fill" id="ringFill" cx="77" cy="77" r="65"
          stroke-dasharray="408.41" stroke-dashoffset="408.41"/>
      </svg>
      <div class="ring-center">
        <div class="ring-n"   id="mastN">0</div>
        <div class="ring-lbl">מתוך 103</div>
      </div>
    </div>
    <div class="legend">
      <div class="leg"><div class="ldot" style="background:#ef4444"></div><span id="legNew">103 חדשות</span></div>
      <div class="leg"><div class="ldot" style="background:#f59e0b"></div><span id="legAlm">0 כמעט</span></div>
      <div class="leg"><div class="ldot" style="background:#10b981"></div><span id="legDone">0 נלמדו</span></div>
    </div>
  </div>

  <div class="home-btns">
    <button class="btn-play" id="btnStart" onclick="startGame()">🎮 התחל ללמוד!</button>
    <button class="btn-sec"  onclick="confirmReset()">🗑 אפס התקדמות</button>
  </div>
</div>

<!-- GAME -->
<div id="s-game" class="screen">
  <div class="g-top">
    <div class="g-learned">נלמדו <strong id="gMastN">0</strong>/103 🎓</div>
    <div class="g-remain" id="gRemain">נשאר 103</div>
  </div>
  <div class="gbar-wrap"><div class="gbar" id="gbar" style="width:0%"></div></div>

  <div class="wcard">
    <div class="wc-emoji" id="wcEmoji">❓</div>
    <div class="wc-part"  id="wcPart"></div>
    <div class="wc-word"  id="wcWord"></div>
    <button class="speak-btn" id="speakBtn" onclick="speakWord()">🔊 שמע הגייה</button>
    <div class="hint-box" id="hintBox"></div>
    <div class="hit-dots">
      <div class="hdot" id="d0"></div>
      <div class="hdot" id="d1"></div>
    </div>
  </div>

  <div class="opts" id="optsGrid"></div>
</div>

<!-- MASTERED FLASH -->
<div class="mflash" id="mflash">
  <div class="mbadge" id="mbadgeTxt">✅ נלמד!</div>
</div>

<!-- WIN -->
<div id="s-win" class="screen">
  <div class="wtrophy">🏆</div>
  <div class="wtitle">כל המילים נלמדו! 🎉</div>
  <div class="wsub">סיימת את כל 103 המילות — כל הכבוד!</div>
  <div class="wstats">
    <div class="wstat"><div class="n" id="wTot" style="color:#c084fc">103</div><div class="l">מילים</div></div>
    <div class="wstat"><div class="n" id="wOk"  style="color:#10b981">0</div><div class="l">נכון</div></div>
    <div class="wstat"><div class="n" id="wBad" style="color:#ef4444">0</div><div class="l">טעויות</div></div>
  </div>
  <button class="btn-again" onclick="resetAll();startGame()">🔄 שחק שוב</button>
  <button class="btn-sec" style="max-width:200px;width:100%;margin-top:6px" onclick="go('home')">🏠 בית</button>
</div>

/* ══ STATE ══ */
let hits = {}, totalOk = 0, totalBad = 0;

function load() {
  try {
    hits     = JSON.parse(localStorage.getItem('wu4_h') || '{}');
    totalOk  = +localStorage.getItem('wu4_ok')  || 0;
    totalBad = +localStorage.getItem('wu4_bad') || 0;
  } catch(e) { hits = {}; }
}
function save() {
  localStorage.setItem('wu4_h',   JSON.stringify(hits));
  localStorage.setItem('wu4_ok',  totalOk);
  localStorage.setItem('wu4_bad', totalBad);
}
function resetAll() { hits = {}; totalOk = 0; totalBad = 0; save(); }
function confirmReset() {
  if (confirm('למחוק את כל ההתקדמות?')) { resetAll(); updateHome(); }
}

function mastCount()  { return W.filter(w => (hits[w.en]||0) >= 2).length; }
function activePool() { return W.filter(w => (hits[w.en]||0) < 2); }

/* ══ HOME ══ */
function go(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById('s-' + name).classList.add('on');
  if (name === 'home') updateHome();
}

function updateHome() {
  const done   = mastCount();
  const almost = W.filter(w => (hits[w.en]||0) === 1).length;
  const fresh  = W.length - done - almost;
  document.getElementById('mastN').textContent   = done;
  document.getElementById('legDone').textContent = done + ' נלמדו';
  document.getElementById('legAlm').textContent  = almost + ' כמעט';
  document.getElementById('legNew').textContent  = fresh + ' חדשות';
  document.getElementById('btnStart').textContent = done > 0 ? '🎮 המשך ללמוד!' : '🎮 התחל ללמוד!';
  const C = 2 * Math.PI * 65;
  document.getElementById('ringFill').style.strokeDashoffset = C * (1 - done / W.length);
}

/* ══ SPEECH ══ */
function speakWord() {
  if (!window.speechSynthesis || !cur) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(cur.en);
  utt.lang  = 'en-US';
  utt.rate  = 0.82;
  utt.pitch = 1;

  const btn = document.getElementById('speakBtn');
  btn.classList.add('speaking');
  utt.onend = () => btn.classList.remove('speaking');
  utt.onerror = () => btn.classList.remove('speaking');

  // prefer an English voice if available
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.startsWith('en')) || null;
  if (enVoice) utt.voice = enVoice;

  window.speechSynthesis.speak(utt);
}

// auto-speak when word appears (small delay so voices are loaded)
function autoSpeak() {
  setTimeout(speakWord, 400);
}

/* ══ AUDIO ══ */
let actx;
function beep(f,d,t='sine',v=0.25) {
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type=t; o.frequency.value=f;
    g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);
    o.start(); o.stop(actx.currentTime+d);
  } catch(e) {}
}
const sndOk  = ()=>{beep(523,.08);setTimeout(()=>beep(659,.08),65);setTimeout(()=>beep(784,.2),130);};
const sndBad = ()=>beep(160,.35,'sawtooth',.14);
const sndMast= ()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*75));
const sndWin = ()=>[523,587,659,784,880,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*90));

/* ══ GAME ══ */
function shuffle(a) {
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

let pool=[], cur=null, locked=false;

function buildPool() {
  const active=activePool();
  if(!active.length) return [];
  const bag=[];
  active.forEach(w=>{const n=(hits[w.en]||0)===0?3:2;for(let i=0;i<n;i++)bag.push(w);});
  return shuffle(bag);
}

function startGame() {
  if(!activePool().length) resetAll();
  pool=buildPool(); go('game'); nextWord();
}

function nextWord() {
  locked=false;
  if(!pool.length) pool=buildPool();
  if(!pool.length){showWin();return;}
  cur=pool.shift();
  renderWord();
}

function renderWord() {
  const w=cur;
  const el=document.getElementById('wcWord');
  el.textContent=w.en;
  const len=w.en.length;
  el.style.fontSize=len>14?'24px':len>9?'32px':'42px';

  document.getElementById('wcEmoji').textContent = w.e;
  document.getElementById('wcPart').textContent  = w.p;
  document.getElementById('hintBox').textContent = w.hint;

  const h=hits[w.en]||0;
  document.getElementById('d0').className='hdot'+(h>=1?' on':'');
  document.getElementById('d1').className='hdot'+(h>=2?' on':'');

  const mast=mastCount(), remain=activePool().length;
  document.getElementById('gMastN').textContent  = mast;
  document.getElementById('gRemain').textContent = 'נשאר '+remain;
  document.getElementById('gbar').style.width    = (mast/W.length*100)+'%';

  const others=shuffle(W.filter(x=>x.en!==w.en)).slice(0,3);
  const opts=shuffle([w,...others]);
  const grid=document.getElementById('optsGrid');
  grid.innerHTML='';
  opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=opt.he;
    btn.onclick=()=>answer(btn,opt);
    grid.appendChild(btn);
  });

  autoSpeak();
}

function answer(btn, chosen) {
  if(locked) return;
  locked=true;

  if(chosen.en===cur.en) {
    btn.classList.add('ok');
    sndOk(); totalOk++;
    hits[cur.en]=(hits[cur.en]||0)+1;
    save();
    if(hits[cur.en]>=2) setTimeout(()=>flashMastered(cur.en),180);
    else setTimeout(nextWord,620);
  } else {
    btn.classList.add('bad');
    document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===cur.he)b.classList.add('rev');});
    sndBad(); totalBad++;
    save();
    pool.splice(Math.min(3,pool.length),0,cur);
    setTimeout(nextWord,1300);
  }
  const h=hits[cur.en]||0;
  document.getElementById('d0').className='hdot'+(h>=1?' on':'');
}

function flashMastered(en) {
  sndMast();
  document.getElementById('mbadgeTxt').textContent='✅ "'+en+'" — נלמד!';
  const fl=document.getElementById('mflash');
  fl.classList.add('on');
  confetti(28);
  setTimeout(()=>{
    fl.classList.remove('on');
    if(!activePool().length) setTimeout(showWin,250);
    else nextWord();
  },1400);
}

function showWin() {
  sndWin();
  document.getElementById('wOk').textContent =totalOk;
  document.getElementById('wBad').textContent=totalBad;
  go('win'); confetti(100);
}

function confetti(n) {
  const cols=['#c084fc','#818cf8','#38bdf8','#10b981','#f59e0b','#ef4444','#fff'];
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='cf';
      const s=6+Math.random()*9;
      el.style.cssText=`left:${Math.random()*100}vw;top:-14px;width:${s}px;height:${s}px;`
        +`background:${cols[~~(Math.random()*cols.length)]};`
        +`border-radius:${Math.random()>.5?'50%':'2px'};`
        +`animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.5}s;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),4000);
    },i*22);
  }
}

load(); updateHome();
</script>
