<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordUp! 🚀</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

/* ── fixed gradient background div ── */
#bg {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(160deg, #120a2e 0%, #1e1050 45%, #0d1a3a 100%);
  z-index: -1;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  min-height: 100vh;
}

/* screens */
.screen { display: none; }
.screen.on {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 0 18px 28px;
}

/* ── HOME ── */
#s-home { padding-top: 36px; gap: 0; }

.title-block { text-align: center; margin-bottom: 28px; }
.title {
  font-size: 52px; font-weight: 900; letter-spacing: -2px;
  background: linear-gradient(135deg, #c084fc, #818cf8, #38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.subtitle { font-size: 15px; color: rgba(255,255,255,0.45); margin-top: 3px; }

.prog-section {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  flex: 1; justify-content: center; width: 100%;
}

.ring-wrap { position: relative; width: 160px; height: 160px; }
.ring-wrap svg { display: block; transform: rotate(-90deg); }
.ring-bg   { fill: none; stroke: rgba(255,255,255,0.09); stroke-width: 12; }
.ring-fill { fill: none; stroke: url(#rg); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.ring-center {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-n   { font-size: 38px; font-weight: 900; color: #c084fc; line-height: 1; }
.ring-lbl { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 3px; }

.legend { display: flex; gap: 16px; }
.leg { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8); }
.ldot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

.home-btns {
  display: flex; flex-direction: column; gap: 12px;
  width: 100%; max-width: 300px; margin-top: 32px;
}

.btn-play {
  padding: 19px; border: none; border-radius: 18px;
  background: linear-gradient(135deg, #7c3aed, #4338ca);
  color: #fff; font-size: 20px; font-weight: 800; cursor: pointer;
  box-shadow: 0 8px 28px rgba(124,58,237,0.5);
  transition: transform .12s, box-shadow .12s;
}
.btn-play:active { transform: scale(0.97); }

.btn-sec {
  padding: 13px; border: none; border-radius: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.6); font-size: 15px; font-weight: 600; cursor: pointer;
}

/* ── GAME ── */
#s-game { padding-top: 18px; justify-content: flex-start; }

.g-top {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; margin-bottom: 12px;
}
.g-learned { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.65); }
.g-learned strong { color: #c084fc; font-size: 17px; }
.g-remain  { font-size: 13px; color: rgba(255,255,255,0.38); }

.gbar-wrap { width:100%; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; margin-bottom:22px; overflow:hidden; }
.gbar { height:100%; background: linear-gradient(90deg,#10b981,#c084fc); border-radius:3px; transition:width .6s ease; min-width:3px; }

.wcard {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 26px; padding: 28px 20px;
  text-align: center; margin-bottom: 20px;
}
.wc-part { font-size: 11px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
.wc-word { font-weight: 900; line-height: 1.1; direction: ltr; }
.hit-dots { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
.hdot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.25); transition: all .3s;
}
.hdot.on { background: #c084fc; border-color: #c084fc; box-shadow: 0 0 8px #c084fc88; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; width: 100%; }
.opt {
  padding: 20px 10px; min-height: 68px;
  border: 2px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  background: rgba(255,255,255,0.055);
  color: #fff; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all .12s; line-height: 1.3;
}
.opt:active { transform: scale(0.96); }
.opt.ok  { background: rgba(16,185,129,.22); border-color: #10b981; animation: opop .35s; }
.opt.bad { background: rgba(239,68,68,.22);  border-color: #ef4444; animation: oshk .4s; }
.opt.rev { background: rgba(16,185,129,.14); border-color: rgba(16,185,129,.5); }

@keyframes opop { 0%{transform:scale(1)} 50%{transform:scale(1.07)} 100%{transform:scale(1)} }
@keyframes oshk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

/* mastered flash */
.mflash {
  position: fixed; top:0; left:0; right:0; bottom:0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(16,185,129,0.1);
  pointer-events: none; opacity: 0; transition: opacity .2s;
}
.mflash.on { opacity: 1; }
.mbadge {
  background: linear-gradient(135deg,#10b981,#059669);
  border-radius: 22px; padding: 18px 36px;
  font-size: 26px; font-weight: 900;
  box-shadow: 0 12px 40px rgba(16,185,129,.45);
  animation: bigpop .3s ease;
}
@keyframes bigpop { 0%{transform:scale(.4);opacity:0} 70%{transform:scale(1.08)} 100%{transform:scale(1)} }

/* ── WIN ── */
#s-win { justify-content: center; gap: 22px; padding-top: 40px; }
.wtrophy { font-size: 86px; animation: bounce 1.5s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
.wtitle { font-size: 34px; font-weight: 900; text-align: center; }
.wsub   { font-size: 15px; color: rgba(255,255,255,0.55); text-align: center; }
.wstats { display: flex; gap: 24px; }
.wstat  { text-align: center; }
.wstat .n { font-size: 32px; font-weight: 900; }
.wstat .l { font-size: 12px; color: rgba(255,255,255,0.45); }
.btn-again {
  padding: 17px 38px; border: none; border-radius: 18px;
  background: linear-gradient(135deg,#7c3aed,#4338ca);
  color: #fff; font-size: 18px; font-weight: 800; cursor: pointer;
  box-shadow: 0 8px 28px rgba(124,58,237,.45);
}

/* confetti */
.cf {
  position: fixed; border-radius: 2px; pointer-events: none; z-index: 200;
  animation: cfFall linear forwards;
}
@keyframes cfFall { to { transform:translateY(110vh) rotate(720deg); opacity:0; } }

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }
</style>
</head>
<body>

<div id="s-game" class="screen">

<!-- mastered flash -->

</div>

<div id="s-win" class="screen">
  <div class="wtrophy">🏆</div>
  <div class="wtitle">כל המילים נלמדו! 🎉</div>

    <div class="wstat"><div class="n" id="wTot" style="color:#c084fc">103</div><div class="l">מילים</div></div>
    <div class="wstat"><div class="n" id="wOk"  style="color:#10b981">0</div><div class="l">נכון</div></div>
    <div class="wstat"><div class="n" id="wBad" style="color:#ef4444">0</div><div class="l">טעויות</div></div>
  </div>
  <button class="btn-again" onclick="resetAll(); startGame()">🔄 שחק שוב</button>
  <button class="btn-sec" style="margin-top:6px;max-width:200px;width:100%" onclick="go('home')">🏠 בית</button>

const W = [

  {en:"easier",he:"קל יותר",p:"תואר"},{en:"entry",he:"כניסה",p:"שם עצם"},

  {en:"furniture",he:"רהיטים",p:"שם עצם"},{en:"get to",he:"להגיע ל-",p:"פועל"},

  {en:"then",he:"אז",p:"תואר הפועל"},{en:"thief",he:"גנב",p:"שם עצם"},
  {en:"thousand",he:"אלף",p:"מספר"},{en:"told",he:"סיפר / אמר",p:"פועל עבר"},
  {en:"view",he:"נוף / מבט",p:"שם עצם"},{en:"visit",he:"לבקר",p:"פועל"},
  {en:"was born",he:"נולד",p:"ביטוי"},{en:"well",he:"היטב",p:"תואר הפועל"},
  {en:"went",he:"הלך",p:"פועל עבר"},{en:"win",he:"לנצח",p:"פועל"},
  {en:"winner",he:"מנצח",p:"שם עצם"},{en:"wrote",he:"כתב",p:"פועל עבר"},
];

/* ══ STATE ══ */
let hits = {};   // en -> 0 | 1 | 2
let totalOk = 0, totalBad = 0;

function load() {
  try {
    hits     = JSON.parse(localStorage.getItem('wu3_h') || '{}');
    totalOk  = +localStorage.getItem('wu3_ok')  || 0;
    totalBad = +localStorage.getItem('wu3_bad') || 0;
  } catch(e) { hits = {}; }
}
function save() {
  localStorage.setItem('wu3_h',   JSON.stringify(hits));
  localStorage.setItem('wu3_ok',  totalOk);
  localStorage.setItem('wu3_bad', totalBad);
}
function resetAll() { hits = {}; totalOk = 0; totalBad = 0; save(); }
function confirmReset() {
  if (confirm('למחוק את כל ההתקדמות?')) { resetAll(); updateHome(); }
}

function mastCount()  { return W.filter(w => (hits[w.en]||0) >= 2).length; }
function activePool() { return W.filter(w => (hits[w.en]||0) < 2); }

/* ══ HOME ══ */
function go(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById('s-' + name).classList.add('on');
  if (name === 'home') updateHome();
}

function updateHome() {
  const done   = mastCount();
  const almost = W.filter(w => (hits[w.en]||0) === 1).length;
  const fresh  = W.length - done - almost;
  document.getElementById('mastN').textContent   = done;
  document.getElementById('legDone').textContent = done + ' נלמדו';
  document.getElementById('legAlm').textContent  = almost + ' כמעט';
  document.getElementById('legNew').textContent  = fresh + ' חדשות';
  document.getElementById('btnStart').textContent = done > 0 ? '🎮 המשך ללמוד!' : '🎮 התחל ללמוד!';
  const C = 2 * Math.PI * 68; // circumference for r=68
  document.getElementById('ringFill').style.strokeDashoffset = C * (1 - done / W.length);
}

/* ══ AUDIO ══ */
let actx;
function beep(f, d, t='sine', v=0.25) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(v, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
    o.start(); o.stop(actx.currentTime + d);
  } catch(e) {}
}
const sndOk   = () => { beep(523,.08); setTimeout(()=>beep(659,.08),65); setTimeout(()=>beep(784,.2),130); };
const sndBad  = () => beep(160,.35,'sawtooth',.14);
const sndMast = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*75));
const sndWin  = () => [523,587,659,784,880,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*90));

/* ══ GAME ══ */
function shuffle(a) {
  a = [...a];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

let pool = [], cur = null, locked = false;

function buildPool() {
  const active = activePool();
  if (!active.length) return [];
  const bag = [];
  active.forEach(w => {
    const n = (hits[w.en]||0) === 0 ? 3 : 2;
    for (let i=0; i<n; i++) bag.push(w);
  });
  return shuffle(bag);
}

function startGame() {
  if (!activePool().length) resetAll();
  pool = buildPool();
  go('game');
  nextWord();
}

function nextWord() {
  locked = false;
  if (!pool.length) pool = buildPool();
  if (!pool.length) { showWin(); return; }
  cur = pool.shift();
  renderWord();
}

function renderWord() {
  const w = cur;
  const el = document.getElementById('wcWord');
  el.textContent = w.en;
  const len = w.en.length;
  el.style.fontSize = len > 14 ? '26px' : len > 9 ? '34px' : '44px';

  document.getElementById('wcPart').textContent = w.p;

  const h = hits[w.en] || 0;
  document.getElementById('d0').className = 'hdot' + (h >= 1 ? ' on' : '');
  document.getElementById('d1').className = 'hdot' + (h >= 2 ? ' on' : '');

  const mast   = mastCount();
  const remain = activePool().length;
  document.getElementById('gMastN').textContent  = mast;
  document.getElementById('gRemain').textContent = 'נשאר ' + remain;
  document.getElementById('gbar').style.width    = (mast / W.length * 100) + '%';

  // options: correct + 3 random wrong
  const others = shuffle(W.filter(x => x.en !== w.en)).slice(0,3);
  const opts   = shuffle([w, ...others]);
  const grid   = document.getElementById('optsGrid');
  grid.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.he;
    btn.onclick = () => answer(btn, opt);
    grid.appendChild(btn);
  });
}

function answer(btn, chosen) {
  if (locked) return;
  locked = true;

  if (chosen.en === cur.en) {
    // CORRECT
    btn.classList.add('ok');
    sndOk();
    totalOk++;
    hits[cur.en] = (hits[cur.en] || 0) + 1;
    save();
    if (hits[cur.en] >= 2) {
      setTimeout(() => flashMastered(cur.en), 180);
    } else {
      setTimeout(nextWord, 620);
    }
  } else {
    // WRONG — reveal correct, put word back soon
    btn.classList.add('bad');
    document.querySelectorAll('.opt').forEach(b => {
      if (b.textContent === cur.he) b.classList.add('rev');
    });
    sndBad();
    totalBad++;
    save();
    pool.splice(Math.min(3, pool.length), 0, cur); // retry after 3
    setTimeout(nextWord, 1300);
  }

  // live dot update
  const h = hits[cur.en] || 0;
  document.getElementById('d0').className = 'hdot' + (h >= 1 ? ' on' : '');
}

function flashMastered(en) {
  sndMast();
  document.getElementById('mbadgeTxt').textContent = '✅ "' + en + '" — נלמד!';
  const fl = document.getElementById('mflash');
  fl.classList.add('on');
  confetti(28);
  setTimeout(() => {
    fl.classList.remove('on');
    if (!activePool().length) setTimeout(showWin, 250);
    else nextWord();
  }, 1400);
}

function showWin() {
  sndWin();
  document.getElementById('wOk').textContent  = totalOk;
  document.getElementById('wBad').textContent = totalBad;
  go('win');
  confetti(100);
}

function confetti(n) {
  const cols = ['#c084fc','#818cf8','#38bdf8','#10b981','#f59e0b','#ef4444','#fff'];
  for (let i=0; i<n; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'cf';
      const s = 6 + Math.random()*9;
      el.style.cssText = `left:${Math.random()*100}vw;top:-14px;width:${s}px;height:${s}px;`
        + `background:${cols[~~(Math.random()*cols.length)]};`
        + `border-radius:${Math.random()>.5?'50%':'2px'};`
        + `animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.5}s;`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i*22);
  }
}

/* ══ INIT ══ */
load();
updateHome();
</script>
