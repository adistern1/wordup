<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordUp! 🚀</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html { height:100%; }

body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  background: #120a2e;
  background-image: linear-gradient(160deg, #120a2e 0%, #1e1050 45%, #0d1a3a 100%);
  background-attachment: fixed;
}

.screen { display: none; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 18px; }
.screen.on { display: flex; }

/* ── HOME ── */
#s-home { justify-content: space-between; padding-top: 40px; }

.title {
  font-size: 54px; font-weight: 900; letter-spacing: -2px; text-align: center;
  background: linear-gradient(135deg, #c084fc, #818cf8, #38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.subtitle { font-size: 15px; color: rgba(255,255,255,0.45); text-align: center; margin-top: 4px; }

/* progress section */
.prog-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }

.ring-outer { position: relative; width: 160px; height: 160px; }
.ring-outer svg { transform: rotate(-90deg); display: block; }
.ring-bg   { fill:none; stroke: rgba(255,255,255,0.08); stroke-width:12; }
.ring-fill { fill:none; stroke: url(#rg); stroke-width:12; stroke-linecap:round; transition: stroke-dashoffset 1s ease; }
.ring-inner {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-n   { font-size: 38px; font-weight: 900; color: #c084fc; line-height: 1; }
.ring-lbl { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }

.legend { display: flex; gap: 18px; }
.leg { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; }
.dot { width: 11px; height: 11px; border-radius: 50%; }

.home-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; padding-bottom: 28px; }

.btn-play {
  padding: 19px; border: none; border-radius: 18px;
  background: linear-gradient(135deg, #7c3aed, #4338ca);
  color: #fff; font-size: 20px; font-weight: 800; cursor: pointer;
  box-shadow: 0 8px 30px rgba(124,58,237,0.5);
  transition: transform .12s, box-shadow .12s;
}
.btn-play:active { transform: scale(0.97); box-shadow: 0 4px 14px rgba(124,58,237,0.3); }

.btn-reset {
  padding: 13px; border: none; border-radius: 14px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.13);
  color: rgba(255,255,255,0.6); font-size: 15px; font-weight: 600; cursor: pointer;
}

/* ── GAME ── */
#s-game { padding-top: 18px; justify-content: flex-start; }

.g-top {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; margin-bottom: 14px;
}
.g-learned {
  font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.7);
}
.g-learned span { color: #c084fc; font-size: 18px; font-weight: 900; }
.g-remain { font-size: 13px; color: rgba(255,255,255,0.4); }

/* thin progress bar */
.gbar-wrap { width:100%; height:6px; background: rgba(255,255,255,0.08); border-radius:3px; margin-bottom:22px; overflow:hidden; }
.gbar { height:100%; background: linear-gradient(90deg,#10b981,#c084fc); border-radius:3px; transition: width .5s ease; }

/* word card */
.wcard {
  width: 100%;
  background: rgba(255,255,255,0.055);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 28px; padding: 30px 22px;
  text-align: center; margin-bottom: 22px;
  backdrop-filter: blur(6px);
}
.wcard-part { font-size: 11px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
.wcard-word { font-size: 44px; font-weight: 900; direction: ltr; line-height: 1.1; }
.wcard-word.long { font-size: 28px; }
.wcard-word.med  { font-size: 34px; }

/* hit dots */
.hit-dots { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.hdot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.3);
  transition: all .3s;
}
.hdot.filled { background: #c084fc; border-color: #c084fc; }

/* options */
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.opt {
  padding: 20px 10px; min-height: 68px;
  border: 2px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  background: rgba(255,255,255,0.055);
  color: #fff; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all .12s; line-height: 1.3;
}
.opt:active { transform: scale(0.96); }
.opt.ok  { background:rgba(16,185,129,.25); border-color:#10b981; animation: pop .35s; }
.opt.bad { background:rgba(239,68,68,.25);  border-color:#ef4444; animation: shk .4s; }
.opt.rev { background:rgba(16,185,129,.15); border-color:rgba(16,185,129,.5); }

@keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.07)} 100%{transform:scale(1)} }
@keyframes shk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

/* "mastered" flash overlay */
.mastered-flash {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; pointer-events: none;
  opacity: 0; transition: opacity .2s;
  background: rgba(16,185,129,0.12);
  backdrop-filter: blur(2px);
}
.mastered-flash.show { opacity: 1; }
.mastered-badge {
  background: linear-gradient(135deg,#10b981,#059669);
  border-radius: 24px; padding: 20px 40px;
  font-size: 28px; font-weight: 900;
  box-shadow: 0 12px 40px rgba(16,185,129,.5);
  animation: popBig .3s ease;
}
@keyframes popBig { 0%{transform:scale(.5);opacity:0} 70%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }

/* ── CELEBRATION ── */
#s-win { justify-content: center; gap: 22px; padding-top: 40px; }

.win-trophy { font-size: 88px; animation: bounce 1.5s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }

.win-title { font-size: 36px; font-weight: 900; text-align: center; }
.win-sub   { font-size: 16px; color: rgba(255,255,255,0.6); text-align: center; }

.win-stats { display: flex; gap: 24px; }
.wstat { text-align: center; }
.wstat .n { font-size: 32px; font-weight: 900; }
.wstat .l { font-size: 12px; color: rgba(255,255,255,0.45); }

.btn-again {
  padding: 18px 40px; border: none; border-radius: 18px;
  background: linear-gradient(135deg,#7c3aed,#4338ca);
  color: #fff; font-size: 19px; font-weight: 800; cursor: pointer;
  box-shadow: 0 8px 30px rgba(124,58,237,.5); margin-top: 8px;
}

/* confetti */
.cf {
  position: fixed; border-radius: 2px; pointer-events: none; z-index: 200;
  animation: cfFall linear forwards;
}
@keyframes cfFall { to { transform:translateY(110vh) rotate(720deg); opacity:0; } }

/* pts popup */
.ptspop {
  position: fixed; pointer-events: none; z-index: 99;
  font-size: 24px; font-weight: 900; opacity: 0;
}

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }
</style>
</head>
<body>

    </linearGradient>

<div id="s-game" class="screen">

<!-- MASTERED FLASH -->
<div class="mastered-flash" id="mastFlash">

</div>

<!-- WIN SCREEN -->
<div id="s-win" class="screen">
  <div class="win-trophy">🏆</div>
  <div class="win-title">כל המילים נלמדו! 🎉</div>
  <div class="win-sub" id="winSub">סיימת את כל 103 המילים!</div>
  <div class="win-stats">
    <div class="wstat"><div class="n" id="wTot" style="color:#c084fc">0</div><div class="l">מילים</div></div>
    <div class="wstat"><div class="n" id="wOk"  style="color:#10b981">0</div><div class="l">נכון</div></div>
    <div class="wstat"><div class="n" id="wBad" style="color:#ef4444">0</div><div class="l">טעויות</div></div>
  </div>
  <button class="btn-again" onclick="resetProgress(); startGame()">🔄 שחק שוב</button>
  <button class="btn-reset" style="margin-top:4px" onclick="go('home')">🏠 בית</button>

/* ══ PROGRESS ══
   hits[en] = 0 (new) | 1 (seen once) | 2 (mastered — removed)
*/
let hits = {};   // en -> 0/1/2
let totalOk = 0, totalBad = 0;

function load() {
  try { hits = JSON.parse(localStorage.getItem('wu2_hits') || '{}'); } catch(e) {}
  totalOk  = +localStorage.getItem('wu2_ok')  || 0;
  totalBad = +localStorage.getItem('wu2_bad') || 0;
}
function save() {
  localStorage.setItem('wu2_hits', JSON.stringify(hits));
  localStorage.setItem('wu2_ok',   totalOk);
  localStorage.setItem('wu2_bad',  totalBad);
}
function resetProgress() {
  hits = {}; totalOk = 0; totalBad = 0; save(); updateHome();
}

function masteredCount() { return W.filter(w => (hits[w.en]||0) >= 2).length; }
function activePool()    { return W.filter(w => (hits[w.en]||0) < 2); }

/* ══ HOME ══ */
function go(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById('s-' + name).classList.add('on');
  if (name === 'home') updateHome();
}

function updateHome() {
  const done   = masteredCount();
  const almost = W.filter(w => (hits[w.en]||0) === 1).length;
  const fresh  = W.length - done - almost;
  document.getElementById('mastN').textContent    = done;
  document.getElementById('legDone').textContent   = done + ' נלמדו';
  document.getElementById('legAlmost').textContent = almost + ' כמעט';
  document.getElementById('legNew').textContent    = fresh + ' חדשות';
  document.getElementById('btnStart').textContent  = done > 0 ? '🎮 המשך ללמוד!' : '🎮 התחל ללמוד!';
  const C = 2 * Math.PI * 68;
  document.getElementById('ringFill').style.strokeDashoffset = C * (1 - done / W.length);
}

/* ══ AUDIO ══ */
let actx = null;
function beep(f, d, type='sine', v=0.25) {
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
    o.start(); o.stop(actx.currentTime + d);
  } catch(e) {}
}
function sndOk()  { beep(523,.07); setTimeout(()=>beep(659,.07),65); setTimeout(()=>beep(784,.18),130); }
function sndBad() { beep(180,.3,'sawtooth',.15); }
function sndMast(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*80)); }
function sndWin() { [523,587,659,784,880,1047,1175].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*90)); }

/* ══ SHUFFLE ══ */
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ══ GAME STATE ══ */
let pool = [];        // current round queue
let current = null;   // current word
let locked = false;

function buildPool() {
  /* Weight: hits=0 → 3 copies, hits=1 → 2 copies */
  const active = activePool();
  if (active.length === 0) return [];
  const bag = [];
  active.forEach(w => {
    const n = (hits[w.en]||0) === 0 ? 3 : 2;
    for (let i=0;i<n;i++) bag.push(w);
  });
  return shuffle(bag);
}

function startGame() {
  if (activePool().length === 0) { resetProgress(); }
  pool = buildPool();
  go('game');
  nextWord();
}

function nextWord() {
  locked = false;
  if (pool.length === 0) pool = buildPool();
  if (pool.length === 0) { showWin(); return; }
  current = pool.shift();
  renderWord();
}

function renderWord() {
  const w = current;
  const wEl = document.getElementById('wcWord');
  wEl.textContent = w.en;
  wEl.className = 'wcard-word' + (w.en.length > 14 ? ' long' : w.en.length > 9 ? ' med' : '');

  document.getElementById('wcPart').textContent = w.p;

  const h = hits[w.en]||0;
  document.getElementById('dot0').className = 'hdot' + (h >= 1 ? ' filled' : '');
  document.getElementById('dot1').className = 'hdot' + (h >= 2 ? ' filled' : '');

  const mastered = masteredCount();
  const remain   = activePool().length;
  document.getElementById('gMastN').textContent = mastered;
  document.getElementById('gRemain').textContent = `נשאר ${remain}`;
  document.getElementById('gbar').style.width = (mastered / W.length * 100) + '%';

  /* options */
  const others = shuffle(W.filter(x => x.en !== w.en)).slice(0,3);
  const opts   = shuffle([w, ...others]);
  const grid   = document.getElementById('optsGrid');
  grid.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.he;
    btn.onclick = () => answer(btn, opt);
    grid.appendChild(btn);
  });
}

function answer(btn, chosen) {
  if (locked) return;
  locked = true;

  const correct = chosen.en === current.en;
  if (correct) {
    btn.classList.add('ok');
    sndOk();
    totalOk++;
    const prev = hits[current.en]||0;
    hits[current.en] = prev + 1;
    save();

    if (hits[current.en] >= 2) {
      /* word mastered! */
      setTimeout(() => showMastered(current.en), 200);
    } else {
      setTimeout(nextWord, 600);
    }
  } else {
    btn.classList.add('bad');
    /* reveal correct */
    document.querySelectorAll('.opt').forEach(b => {
      if (b.textContent === current.he) b.classList.add('rev');
    });
    sndBad();
    totalBad++;
    save();
    /* put word back into pool soon (after 3 others) */
    pool.splice(Math.min(3, pool.length), 0, current);
    setTimeout(nextWord, 1200);
  }

  /* update dots live */
  const h = hits[current.en]||0;
  document.getElementById('dot0').className = 'hdot' + (h >= 1 ? ' filled' : '');
}

function showMastered(en) {
  sndMast();
  const flash = document.getElementById('mastFlash');
  document.getElementById('mastBadgeText').textContent = `✅ "${en}" — נלמד!`;
  flash.classList.add('show');

  /* confetti burst */
  confetti(30);

  setTimeout(() => {
    flash.classList.remove('show');
    if (activePool().length === 0) { setTimeout(showWin, 300); }
    else nextWord();
  }, 1400);
}

/* ══ WIN ══ */
function showWin() {
  sndWin();
  document.getElementById('wTot').textContent = W.length;
  document.getElementById('wOk').textContent  = totalOk;
  document.getElementById('wBad').textContent = totalBad;
  go('win');
  confetti(100);
}

/* ══ CONFETTI ══ */
function confetti(n) {
  const cols = ['#c084fc','#818cf8','#38bdf8','#10b981','#f59e0b','#ef4444','#fff'];
  for (let i=0;i<n;i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'cf';
      const sz = 6 + Math.random()*9;
      el.style.cssText = `
        left:${Math.random()*100}vw; top:-14px;
        width:${sz}px; height:${sz}px;
        background:${cols[Math.floor(Math.random()*cols.length)]};
        border-radius:${Math.random()>.5?'50%':'2px'};
        animation-duration:${1.6+Math.random()*2}s;
        animation-delay:${Math.random()*.5}s;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 20);
  }
}

/* ══ INIT ══ */
load();
updateHome();
